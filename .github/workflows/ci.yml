name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Release publication boundaries
        run: python3 tools/test-release-boundaries.py
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      # Speed software SHA in test builds without changing pinned manifests or release builds.
      - name: Build
        run: cargo --config profile.dev.package.sha2.opt-level=3 build --workspace --locked
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo --config profile.dev.package.sha2.opt-level=3 test --workspace --locked -- --test-threads=1
      - name: Clippy
        run: cargo --config profile.dev.package.sha2.opt-level=3 clippy --workspace --locked --all-targets -- -D warnings
