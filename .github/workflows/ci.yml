name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Release publication boundaries
        run: python3 tools/test-release-boundaries.py
      - name: Python tools
        run: pipx run ruff==0.16.1 check --no-cache tools
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Build
        run: cargo build --workspace --locked
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --workspace --locked -- --test-threads=1
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

  macos-performance:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
          components: clippy
      - name: Build performance CLI
        run: cargo build -p grill-perf --locked
      - name: Test performance CLI
        run: cargo test -p grill-perf --locked -- --test-threads=1
      - name: Clippy performance CLI
        run: cargo clippy -p grill-perf --locked --all-targets -- -D warnings
