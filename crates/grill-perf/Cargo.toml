[package]
name = "grill-perf"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
grill-sse = { path = "../grill-sse" }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std", "raw_value", "float_roundtrip"] }
sha2 = { version = "0.11", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "signal", "macros", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", default-features = false }
